<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau médicament - Pharma Security</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Ajouter un médicament</h1>
    <div class="card">
        <form th:action="@{/medicaments/ajouter}" th:object="${medicament}" method="post" class="formulaire">
            <label>Nom</label>
            <input type="text" th:field="*{nom}" required>
            <label>Description</label>
            <input type="text" th:field="*{description}">
            <label>Prix (DH)</label>
            <input type="number" step="0.01" min="0" th:field="*{prix}" required>
            <label>Quantité en stock</label>
            <input type="number" min="0" th:field="*{quantiteStock}" required>
            <label>Date d'expiration</label>
            <input type="date" th:field="*{dateExpiration}" required>
            <p>
                <button class="btn" type="submit">Enregistrer</button>
                <a class="btn gris" th:href="@{/medicaments}">Annuler</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
