<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ventes - Pharma Security</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Enregistrer une vente</h1>
    <div class="msg succes" th:if="${succes}" th:text="${succes}"></div>
    <div class="msg erreur" th:if="${erreur}" th:text="${erreur}"></div>

    <div class="card">
        <form class="ligne" th:action="@{/ventes/enregistrer}" method="post">
            <select name="medicamentId" required>
                <option value="">-- Choisir un médicament --</option>
                <option th:each="m : ${medicaments}" th:value="${m.id}"
                        th:text="${m.nom + ' (' + m.prix + ' DH, stock : ' + m.quantiteStock + ')'}">Médicament</option>
            </select>
            <input class="court" type="number" name="quantite" min="1" value="1" required>
            <button class="btn" type="submit">Valider la vente</button>
        </form>
    </div>

    <h2>Dernières ventes</h2>
    <table>
        <thead>
        <tr><th>Date</th><th>Médicament</th><th>Quantité</th><th>Total (DH)</th><th>Vendeur</th></tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventes}">
            <td th:text="${v.dateVenteFormatee}">date</td>
            <td th:text="${v.medicament?.nom}">médicament</td>
            <td th:text="${v.quantite}">1</td>
            <td th:text="${v.prixTotal}">0.00</td>
            <td th:text="${v.vendeur}">vendeur</td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventes)}">
            <td colspan="5" class="vide">Aucune vente enregistrée.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
